<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armário · Changelog</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav></nav>
<main>
  <h1>Changelog</h1>
  <div id="list"></div>
</main>
<script src="js/app.js"></script>
<script>
api("/changelog.json").then((items) => {
  $("list").innerHTML = items.map((v) => `<section class="card" style="margin-bottom:14px"><h2>${esc(v.versao)} <span class="muted">· ${esc(v.data)}</span></h2><ul>${v.mudancas.map((m) => `<li>${esc(m)}</li>`).join("")}</ul></section>`).join("");
}).catch((e) => toast(e.message));
</script>
</body>
</html>
